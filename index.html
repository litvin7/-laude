<style>
  /* Тёплая «киношная» палитра под кадры Peep & Peak, округлый Nunito, кнопки в стиле Instagram */
  :root {
    --bg: #fbf6ef;
    --bg-2: #f3e9dc;
    --card: #ffffff;
    --ink: #2a1c13;
    --ink-2: #4a3628;
    --muted: #6b5546;
    --line: #eadccb;
    --caramel: #b77b4b;
    --caramel-2: #9a6238;
    --honey: #e2a85c;
    --rose: #c4566e;
    --ig: linear-gradient(45deg, #f9ce34 0%, #ee2a7b 45%, #6228d7 100%);
    --grad-text: linear-gradient(100deg, #9a6238 0%, #c88653 45%, #e2a85c 100%);
    --font: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --max: 1120px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  img, svg { display: block; max-width: 100%; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 20px; }
  section { padding: 88px 0; }
  h1, h2, h3 { margin: 0; letter-spacing: -0.02em; line-height: 1.1; text-wrap: balance; }
  h1 { font-size: clamp(36px, 5vw, 64px); font-weight: 900; }
  h2 { font-size: clamp(28px, 3.6vw, 44px); font-weight: 900; margin-bottom: 14px; }
  h3 { font-size: 19px; font-weight: 800; }
  p { margin: 0; }
  em { font-style: normal; background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .eyebrow { display: inline-block; font-size: 12px; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; color: var(--caramel); margin-bottom: 14px; }
  .head { max-width: 680px; margin-bottom: 40px; }
  .head.center { margin-left: auto; margin-right: auto; text-align: center; }
  .head p { color: var(--muted); font-size: 18px; }

  svg.ico { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  svg.ico.fill { fill: currentColor; }

  /* кнопки */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 22px; border-radius: 10px; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 15px; text-decoration: none; text-align: center; transition: transform .15s, filter .15s, background .15s; }
  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }
  .btn-ig { background: var(--ig); color: #fff; }
  .btn-ig:hover { filter: brightness(1.06); }
  .btn-light { background: #efefef; color: #111; }
  .btn-light:hover { background: #e2e2e2; }
  .btn-sm { padding: 9px 14px; font-size: 14px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }

  /* шапка */
  header.nav { position: sticky; top: 0; z-index: 30; background: rgba(251,246,239,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 68px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 900; font-size: 22px; white-space: nowrap; }
  .logo em { -webkit-text-fill-color: var(--caramel); }
  .logo svg { width: 34px; height: 34px; }
  .nav-links { display: flex; align-items: center; gap: 26px; }
  .nav-links > a:not(.btn) { text-decoration: none; color: var(--muted); font-weight: 700; font-size: 15px; }
  .nav-links > a:not(.btn):hover { color: var(--ink); }

  /* первый экран */
  .hero { padding: 56px 0 72px; background: radial-gradient(80% 70% at 90% 0%, #f7dcc0 0%, transparent 60%), var(--bg); overflow: hidden; }
  .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; }
  .hero .lead { color: var(--muted); font-size: 19px; margin: 20px 0 28px; max-width: 540px; }
  .stats { display: flex; gap: 32px; flex-wrap: wrap; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); }
  .stat b { display: block; font-size: 30px; font-weight: 900; line-height: 1; }
  .stat span { font-size: 13px; color: var(--muted); }
  .reels { height: min(70vh, 620px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(transparent, #000 10%, #000 90%, transparent); }
  .reel-col { display: flex; flex-direction: column; gap: 12px; animation: up 50s linear infinite; }
  .reel-col.down { animation-name: down; animation-duration: 56s; }
  .reel-col:nth-child(3) { animation-duration: 44s; }
  .reel-col img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 10px; background: var(--bg-2); }
  @keyframes up { to { transform: translateY(-50%); } }
  @keyframes down { from { transform: translateY(-50%); } to { transform: translateY(0); } }

  .marquee { overflow: hidden; background: #fff; border-block: 1px solid var(--line); padding: 16px 0; }
  .marquee-track { display: flex; gap: 40px; width: max-content; animation: marquee 50s linear infinite; font-weight: 800; font-size: 18px; }
  .marquee-track span { display: inline-flex; align-items: center; gap: 40px; white-space: nowrap; }
  .marquee-track svg.ico { width: 12px; height: 12px; color: var(--honey); }
  @keyframes marquee { to { transform: translateX(-50%); } }

  /* видео-примеры */
  .videos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .video { position: relative; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; border: 0; padding: 0; cursor: pointer; background: #1a120c; }
  .video img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease, filter .3s; }
  .video:hover img { transform: scale(1.04); filter: brightness(.9); }
  .video .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.92); color: #111; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .video .play svg { width: 22px; height: 22px; margin-left: 3px; }
  .video:focus-visible { outline: 3px solid var(--honey); outline-offset: 3px; }
  .modal { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 20px; background: rgba(20,12,7,.85); }
  .modal-box { width: min(400px, 100%); aspect-ratio: 9 / 16; max-height: 86vh; border-radius: 18px; overflow: hidden; background: #000; }
  .modal-box iframe { width: 100%; height: 100%; border: 0; }
  .modal-close { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; background: #fff; font-size: 24px; line-height: 1; }

  /* цены */
  .prices { background: #fff; border-block: 1px solid var(--line); }
  .tiers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .tier { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 22px 18px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
  .tier .dur { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--caramel-2); }
  .tier h3 { font-size: 20px; }
  .tier .price { font-size: 38px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; margin: 6px 0 4px; }
  .tier p { color: var(--muted); font-size: 14px; line-height: 1.45; flex: 1; }
  .tier.hit { background: #fff6ec; border: 1.5px solid var(--honey); }
  .tier.premium { background: #2e1e15; color: #fbf1e2; border-color: #2e1e15; }
  .tier.premium p { color: rgba(251,241,226,.72); }
  .tier.premium .dur { color: var(--honey); }
  .badge { position: absolute; top: -11px; left: 18px; font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--honey); color: #fff; }
  .includes { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; margin-top: 26px; color: var(--ink-2); font-size: 15px; font-weight: 700; }
  .includes span { display: inline-flex; align-items: center; gap: 8px; }
  .includes svg.ico { color: var(--caramel); }


  /* идеи по 2 в ряд */
  .ideas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; max-width: 920px; margin: 0 auto; }
  .idea { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; padding: 12px; border-radius: 14px; background: #fff; border: 1px solid var(--line); }
  .idea img { width: 150px; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
  .idea h3 { margin-bottom: 4px; }
  .idea p { color: var(--muted); font-size: 15px; line-height: 1.45; }

  /* герои */
  .meet { background: var(--bg-2); }
  .meet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
  .meet-grid > img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 16px; }
  .traits { display: grid; gap: 10px; margin-top: 20px; }
  .trait { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; }
  .trait svg.ico { color: var(--caramel); margin-top: 3px; }
  .trait b { font-weight: 800; }

  /* как заказать */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; counter-reset: s; }
  .step { padding: 22px; border-radius: 14px; background: #fff; border: 1px solid var(--line); }
  .step::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 900; margin-bottom: 14px; }
  .step h3 { margin-bottom: 6px; }
  .step p { color: var(--muted); font-size: 15px; }
  .msg { margin-top: 18px; padding: 20px 22px; border-radius: 14px; background: #fff; border: 1px dashed var(--caramel); display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .msg p { font-size: 15px; color: var(--ink-2); min-width: 0; flex: 1 1 360px; }
  .msg b { color: var(--ink); }

  /* вопросы */
  .faq { max-width: 780px; margin: 0 auto; }
  details { border-bottom: 1px solid var(--line); padding: 18px 0; }
  summary { cursor: pointer; font-weight: 800; font-size: 18px; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--caramel); font-size: 26px; line-height: 1; transition: transform .2s; }
  details[open] summary::after { transform: rotate(45deg); }
  details p { color: var(--muted); margin-top: 10px; }

  /* финал */
  .final { position: relative; overflow: hidden; border-radius: 18px; min-height: 420px; display: grid; place-items: center; text-align: center; padding: 56px 24px; color: #fff6e6; }
  .final > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .final::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,12,7,.66), rgba(20,12,7,.86)); }
  .final > div { position: relative; }
  .final h2 { color: #fff6e6; }
  .final p { color: rgba(255,246,230,.88); max-width: 520px; margin: 0 auto 26px; font-size: 18px; }
  .final .btns { justify-content: center; }

  footer { padding: 32px 0 40px; color: var(--muted); font-size: 14px; }
  .foot { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .foot nav { display: flex; gap: 18px; }
  .foot a { text-decoration: none; font-weight: 700; }
  .foot a:hover { color: var(--caramel); }

  .float { position: fixed; right: 18px; bottom: 18px; z-index: 40; display: grid; gap: 10px; }
  .float a { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; color: #fff; box-shadow: 0 12px 28px -10px rgba(0,0,0,.45); transition: transform .15s; }
  .float a:hover { transform: scale(1.06); }
  .float a svg { width: 26px; height: 26px; }
  .float .ig { background: var(--ig); }


  /* переключатель языка */
  .lang { position: relative; display: inline-flex; align-items: center; }
  .lang svg.ico { position: absolute; inset-inline-start: 10px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .lang select { appearance: none; -webkit-appearance: none; font: inherit; font-size: 14px; font-weight: 800; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 30px 8px 32px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  .lang select:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }
  [dir="rtl"] .lang select { padding: 8px 32px 8px 30px; background-position: 16px 52%, 11px 52%; }
  [dir="rtl"] .badge { left: auto; right: 18px; }
  [dir="rtl"] .float { right: auto; left: 18px; }
  .marquee-track { direction: ltr; }

  @media (max-width: 1000px) {
    .hero-grid, .meet-grid { grid-template-columns: 1fr; }
    .reels { height: 340px; order: -1; }
    .tiers { grid-template-columns: repeat(3, 1fr); }
    .steps { grid-template-columns: 1fr; }
    .nav-links > a { display: none; }
    section { padding: 64px 0; }
  }
  @media (max-width: 720px) {
    body { font-size: 16px; }
    .wrap { padding: 0 16px; }
    .hero { padding: 24px 0 48px; }
    .hero .lead { font-size: 16px; }
    .hero .btns .btn { flex: 1 1 100%; }
    .reels { height: 260px; gap: 8px; }
    .reel-col { gap: 8px; }
    .stats { gap: 18px; }
    .stat b { font-size: 24px; }
    .videos { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .tiers { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .tier { padding: 18px 14px; }
    .tier .price { font-size: 30px; }
    .tier.premium { grid-column: 1 / -1; }
    .ideas { gap: 10px; }
    .idea { grid-template-columns: 1fr; gap: 8px; padding: 8px; }
    .idea img { width: 100%; }
    .idea h3 { font-size: 15px; }
    .idea p { font-size: 13px; }
    .nav-links .btn-sm span { display: none; }
    .logo { font-size: 19px; }
    .float { right: 12px; bottom: 12px; }
    .float a { width: 50px; height: 50px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

  /* ================================== */

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];
  const ic = (n, c = "") => `<svg class="ico ${c}"><use href="#i-${n}"/></svg>`;
  const LINKS = { ig: `https://ig.me/m/${CONFIG.instagram}`, profile: `https://instagram.com/${CONFIG.instagram}` };
  $$("[data-link]").forEach((a) => { a.href = LINKS[a.dataset.link]; a.target = "_blank"; a.rel = "noopener"; });
  $("#year").textContent = new Date().getFullYear();
  $("#from-price").textContent = "$" + Math.min(...CONFIG.tiers.map((t) => t.price));

  // лента кадров (без текста, не зависит от языка)
  const cols = [[], [], []];
  CONFIG.reels.forEach((n, i) => cols[i % 3].push(`<img src="images/frames/${n}.jpg" alt="" loading="${i < 6 ? "eager" : "lazy"}">`));
  $("#reels").innerHTML = cols.map((c, i) => `<div class="reel-col ${i === 1 ? "down" : ""}">${c.join("")}${c.join("")}</div>`).join("");

  // видео
  const ytId = (u) => (String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/) || [])[1];
  const fallback = ["emma-cake", "emma-pillow", "sky-love", "emma-sand"];
  $("#videos").innerHTML = CONFIG.videos.map((u, i) => {
    const id = ytId(u);
    return `<button type="button" class="video" data-yt="${id}" data-n="${i + 1}">
      <img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy" onerror="this.onerror=null;this.src='images/frames/${fallback[i % fallback.length]}.jpg'">
      <span class="play">${ic("play", "fill")}</span>
    </button>`;
  }).join("");
  const modal = $("#modal");
  const close = () => { modal.hidden = true; $("#modal-box").innerHTML = ""; };
  $$("[data-yt]").forEach((b) => b.addEventListener("click", () => {
    $("#modal-box").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.yt}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Peep & Peak"></iframe>`;
    modal.hidden = false;
  }));
  $("#modal-close").addEventListener("click", close);
  modal.addEventListener("click", (e) => { if (e.target === modal) close(); });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal.hidden) close(); });

  /* ---------- язык ---------- */
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const loadedFonts = new Set();
  function loadFont(family) {
    if (!family || loadedFonts.has(family)) return;
    loadedFonts.add(family);
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = `https://fonts.googleapis.com/css2?family=${family.replace(/ /g, "+")}:wght@400;700;900&display=swap`;
    document.head.appendChild(l);
  }

  function render(t) {
    $$("[data-i18n]").forEach((el) => { el.textContent = t[el.dataset.i18n]; });
    $$("[data-i18n-html]").forEach((el) => { el.innerHTML = t[el.dataset.i18nHtml]; });
    $$("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t[el.dataset.i18nAria]); });
    $$("[data-i18n-alt]").forEach((el) => { el.alt = t[el.dataset.i18nAlt]; });
    $$("[data-yt]").forEach((b) => b.setAttribute("aria-label", `${t.ex_watch} ${b.dataset.n}`));

    const m = t.occasions.map((o) => `<span>${esc(o)}${ic("star5", "fill")}</span>`).join("");
    $("#marquee").innerHTML = m + m;

    $("#tiers").innerHTML = CONFIG.tiers.map((p, i) => `
      <article class="tier ${p.hit ? "hit" : ""} ${p.premium ? "premium" : ""}">
        ${p.hit ? `<span class="badge">${esc(t.popular)}</span>` : ""}
        <span class="dur">${ic("clock")} ${p.sec} ${esc(t.sec)}</span>
        <h3>${esc(t.tiers[i].n)}</h3>
        <div class="price">$${p.price}</div>
        <p>${esc(t.tiers[i].t)}</p>
      </article>`).join("");
    $("#includes").innerHTML = t.inc.map((x, i) => `<span>${ic(i === 3 ? "clock" : "check")}${esc(x)}</span>`).join("");

    $("#ideas-list").innerHTML = CONFIG.ideaImages.map((img, i) => `
      <article class="idea">
        <img src="images/frames/${img}.jpg" alt="${esc(t.ideas[i].t)}" loading="lazy">
        <div><h3>${esc(t.ideas[i].t)}</h3><p>${esc(t.ideas[i].d)}</p></div>
      </article>`).join("");

    $("#steps").innerHTML = t.steps.map((s) => `<div class="step"><h3>${esc(s.h)}</h3><p>${esc(s.p)}</p></div>`).join("");
    $("#faq-list").innerHTML = t.faq.map((f) => `<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("");
  }

  function setLang(code, save) {
    const lang = LANGS.find((l) => l.code === code) || LANGS[0];
    const t = I18N[lang.code];
    document.documentElement.lang = lang.code;
    document.documentElement.dir = lang.rtl ? "rtl" : "ltr";
    loadFont(lang.font);
    document.documentElement.style.setProperty("--font", `"Nunito", ${lang.font ? `"${lang.font}", ` : ""}system-ui, -apple-system, "Segoe UI", sans-serif`);
    document.title = t.title;
    $('meta[name="description"]').content = t.desc;
    render(t);
    $("#lang-select").value = lang.code;
    if (save) { try { localStorage.setItem("lang", lang.code); } catch {} }
  }

  function detectLang() {
    const supported = LANGS.map((l) => l.code);
    const fromUrl = new URLSearchParams(location.search).get("lang");
    if (supported.includes(fromUrl)) return fromUrl;
    try { const saved = localStorage.getItem("lang"); if (supported.includes(saved)) return saved; } catch {}
    for (const l of navigator.languages || [navigator.language || ""]) {
      const base = String(l).toLowerCase().split("-")[0];
      if (supported.includes(base)) return base;
    }
    return CONFIG.defaultLang;
  }

  $("#lang-select").innerHTML = LANGS.map((l) => `<option value="${l.code}">${l.name}</option>`).join("");
  $("#lang-select").addEventListener("change", (e) => setLang(e.target.value, true));
  setLang(detectLang(), false);
</script>
